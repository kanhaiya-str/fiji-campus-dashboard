<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiji Campus Bus & Weather Dashboard</title>

<style>
    /* General page styling */
    body {
        font-family: Arial, sans-serif;
        background: #eef6ff;
        margin: 0;
        padding: 20px;
    }

    .container {
        max-width: 600px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    h1 {
        text-align: center;
        color: #006699;
    }

    .section {
        margin-top: 20px;
    }

    label {
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 10px;
        margin-top: 8px;
        margin-bottom: 10px;
        box-sizing: border-box;
    }

    button {
        width: 100%;
        padding: 10px;
        background: #0077cc;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background: #005fa3;
    }

    #result,
    .weather-box {
        margin-top: 15px;
        padding: 15px;
        background: #f4faff;
        border-left: 5px solid #0077cc;
        border-radius: 5px;
    }
</style>
</head>

<body>

<div class="container">
    <h1>Fiji Campus Bus & Weather Dashboard</h1>

    <!-- Bus Fare Calculator -->
    <div class="section">
        <label for="budget">Enter Bus Fare Budget (FJD):</label>
        <input
            type="number"
            id="budget"
            placeholder="e.g. 15"
            min="0"
            step="0.01"
        >

        <button onclick="calculateRides()">Calculate Bus Rides</button>

        <div id="result">
            Enter your budget and click the button.
        </div>
    </div>

    <!-- Weather Forecast -->
    <div class="section">
        <h2>Today's Weather in Suva</h2>

        <!--
            Placeholder weather information.
            In a real application this could be replaced
            with data retrieved from a weather API.
        -->
        <div class="weather-box">
            🌤️ Partly Cloudy<br>
            🌡️ Temperature: 27°C<br>
            💨 Wind: 15 km/h<br>
            🌧️ Chance of Rain: 30%
        </div>
    </div>
</div>

<script>
/*
    Calculates how many bus rides a student can afford.

    Assumption:
    Each bus ride costs FJD 1.50.
*/
function calculateRides() {

    // Get the input and result elements
    const budgetInput = document.getElementById("budget");
    const result = document.getElementById("result");

    // Read the user's budget
    const budget = parseFloat(budgetInput.value);

    // Validate the input
    if (budgetInput.value.trim() === "" || isNaN(budget) || budget < 0) {
        result.style.color = "red";
        result.innerHTML = "Please enter a valid positive dollar amount.";
        return;
    }

    // Cost per bus ride
    const fare = 1.50;

    // Calculate the number of whole rides
    const rides = Math.floor(budget / fare);

    // Display the result
    result.style.color = "black";
    result.innerHTML =
        `With FJD ${budget.toFixed(2)}, you can afford <strong>${rides}</strong> bus ride(s).`;
}
</script>

</body>
</html>
